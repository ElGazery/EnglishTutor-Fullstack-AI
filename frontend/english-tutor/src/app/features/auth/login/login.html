<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-badge">
        <span class="icon">🎓</span>
        <span>English Tutor Prep Academy</span>
      </div>
      <h1 class="auth-title">Welcome Back, Student!</h1>
      <p class="auth-subtitle">Sign in to continue your English grammar lessons and conversation practice.</p>
    </div>

    @if (errorMessage()) {
      <div class="alert alert-error" role="alert">
        <span class="alert-icon">⚠️</span>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="student@example.com"
          class="form-input"
          required
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
          class="form-input"
          required
          autocomplete="current-password"
        />
      </div>

      <button
        type="submit"
        id="login-submit-btn"
        class="btn btn-primary btn-block"
        [disabled]="isLoading()"
      >
        @if (isLoading()) {
          <span class="spinner"></span>
          <span>Signing in...</span>
        } @else {
          <span>Sign In to Classroom</span>
          <span>→</span>
        }
      </button>
    </form>

    <div class="auth-footer">
      <p>
        Don't have a student account?
        <a routerLink="/register" class="auth-link">Create one here</a>
      </p>
    </div>
  </div>
</div>
